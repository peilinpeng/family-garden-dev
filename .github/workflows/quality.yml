name: M3 质量门禁

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 全量回归与 Web 导出
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      GODOT_BIN: godot
      PYTHON_BIN: python
      TMPDIR: /tmp

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            backend/ai/package-lock.json
            backend/cloudbase/data_gateway/package-lock.json
            backend/cloudbase/presence_relay/package-lock.json

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.5
          cache: pip
          cache-dependency-path: backend/ai/tests/requirements.txt

      - name: 安装 Godot 与 Web 导出模板
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: 核对工具链版本
        run: |
          godot --version
          node --version
          npm --version
          python --version

      - name: 安装依赖并运行全量回归
        run: ./tools/test_all.sh --bootstrap

      - name: 审计生产依赖关键漏洞
        run: |
          set -euo pipefail
          for workspace in \
            backend/ai \
            backend/cloudbase/data_gateway \
            backend/cloudbase/presence_relay
          do
            printf 'npm audit: %s\n' "$workspace"
            npm --prefix "$workspace" audit --omit=dev --audit-level=critical
          done

      - name: 审计 Web Release
        run: ./tools/check_web_export.sh

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-failure-logs-${{ github.run_id }}
          path: |
            /tmp/family-garden-tests.*/*.log
            /tmp/family-garden-web-export.*/*.log
          if-no-files-found: ignore
          retention-days: 7
